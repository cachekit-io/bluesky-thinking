<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skyline — live Bluesky analytics on CacheKit</title>
    <style>
      :root {
        --surface: #262321;
        --card: #2e2a27;
        --line: #3b3631;
        --ink: #e8e2da;
        --ink-2: #a89f93;
        --accent: #e0a836;
        --hit: #7fb069;
        --miss: #a89f93;
        --err: #d97b66;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--surface);
        color: var(--ink);
        font:
          15px/1.5 'Overpass',
          system-ui,
          sans-serif;
        padding: 2rem 1.25rem 4rem;
        max-width: 72rem;
        margin: 0 auto;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 600;
      }
      h1 span {
        color: var(--accent);
      }
      .sub {
        color: var(--ink-2);
        font-size: 0.85rem;
      }
      .windows {
        margin-left: auto;
        display: flex;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      .windows button {
        background: none;
        border: none;
        color: var(--ink-2);
        font: inherit;
        padding: 0.3rem 0.9rem;
        cursor: pointer;
      }
      .windows button[aria-pressed='true'] {
        background: var(--accent);
        color: #262321;
        font-weight: 600;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }
      .tile {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.9rem 1rem;
      }
      .tile .label {
        color: var(--ink-2);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .tile .value {
        font-size: 1.9rem;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr));
        gap: 0.75rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 1rem;
      }
      .card h2 {
        font-size: 0.95rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .badge {
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 0.1rem 0.45rem;
        border-radius: 4px;
        border: 1px solid;
      }
      .badge.hit {
        color: var(--hit);
        border-color: var(--hit);
      }
      .badge.miss {
        color: var(--miss);
        border-color: var(--miss);
      }
      .badge.err {
        color: var(--err);
        border-color: var(--err);
      }
      .meta {
        color: var(--ink-2);
        font-size: 0.75rem;
        margin-top: 0.15rem;
      }
      .rows {
        margin-top: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(5rem, 40%) 1fr auto;
        gap: 0.6rem;
        align-items: center;
      }
      .row .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row a.name {
        color: var(--ink);
      }
      .rows {
        padding-left: 1.5rem;
      }
      .bar-track {
        background: var(--line);
        border-radius: 0 4px 4px 0;
        height: 8px;
      }
      .row .bar {
        display: block;
        height: 8px;
        background: var(--accent);
        border-radius: 0 4px 4px 0;
        min-width: 2px;
      }
      .row .num {
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
        font-size: 0.85rem;
      }
      .empty,
      .error {
        color: var(--ink-2);
        font-size: 0.85rem;
        margin-top: 0.75rem;
      }
      .error {
        color: var(--err);
      }
      .warning,
      .stale {
        color: var(--accent);
      }
      .warning {
        font-size: 0.85rem;
        margin-top: 0.75rem;
      }
      .hero {
        font-size: 2.6rem;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        margin-top: 0.5rem;
      }
      .hero small {
        font-size: 1rem;
        color: var(--ink-2);
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Skyline <span>/</span> live Bluesky analytics</h1>
        <p class="sub">
          A live Bluesky network pulse, implemented as a CacheKit cross-SDK example. Refreshes every
          30&nbsp;s.
        </p>
      </div>
      <div class="windows" role="group" aria-label="Aggregation window">
        <button data-window="5m" aria-pressed="true">5m</button>
        <button data-window="1h" aria-pressed="false">1h</button>
        <button data-window="24h" aria-pressed="false">24h</button>
      </div>
    </header>

    <div class="tiles" id="tiles"></div>
    <div class="grid" id="grid"></div>

    <script type="module" src="/dashboard.js"></script>
  </body>
</html>
