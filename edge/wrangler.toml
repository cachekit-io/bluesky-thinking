# Skyline edge API + dashboard, deployed on the Workers free plan.
name = "skyline-edge"
main = "src/worker.ts"
compatibility_date = "2026-07-01"

# Set from your secret manager, never this file: see edge/README.md#deploy.
[secrets]
required = ["CACHEKIT_API_KEY", "CACHEKIT_API_URL"]

# Snapshot-history capture (docs/history.md): hourly, because captureTick only
# acts at minute 0 (daily tier + retention sweep at UTC midnight ride the same
# fire). This cron used to be the Render keep-alive ping every 10 minutes; the
# ingester now runs on self-hosted Kubernetes (deploy/k3s/), which never idles
# it out, so the ping is gone and capture owns the schedule.
[triggers]
crons = ["0 * * * *"]

# The Rust-WASM hot path, reached via service binding — not a public URL.
# Every served aggregate is integrity-checked there first.
[[services]]
binding = "HOTPATH"
service = "skyline-hotpath"

# Snapshot-history store (docs/history.md), fed by the hourly cron above (one
# expression of the free plan's five per ACCOUNT, shared with every other
# Worker). Schema changes ship as files in ./migrations; apply with
#   npx wrangler d1 migrations apply skyline-history --remote
# BEFORE deploying a Worker that depends on them.
[[d1_databases]]
binding = "HISTORY"
database_name = "skyline-history"
database_id = "a2cfe6d3-e26a-4e1a-aa02-cb3606f833e7"

# Static dashboard. Asset requests are served before the worker script runs;
# unmatched paths (/api/*) fall through to the fetch handler.
[assets]
directory = "./public"
