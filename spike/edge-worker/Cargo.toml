[package]
name = "skyline-edge-spike"
version = "0.1.0"
edition = "2021"

# LAB-735 spike: proves a downstream Worker can build against cachekit-rs on
# wasm32. Git tag dep because crates.io max is 0.3.0 (no interop) — the
# v0.4.0 publish failed in CI; see spike findings.
[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8"
serde = { version = "1", features = ["derive"] }
cachekit-rs = { git = "https://github.com/cachekit-io/cachekit-rs", tag = "cachekit-rs-v0.4.0", default-features = false, features = ["workers", "cachekitio", "encryption", "macros"] }
