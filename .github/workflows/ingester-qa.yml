name: ingester-qa

on:
  pull_request:
    paths:
      - "ingester/**"
      - ".github/workflows/ingester-qa.yml"
  push:
    branches: [main]
    paths:
      - "ingester/**"
      - ".github/workflows/ingester-qa.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingester
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: ingester/uv.lock
      - name: Sync (locked)
        run: uv sync --locked
      # tools/ is linted too: soak_memory.py is the harness the
      # window-memory bound is measured with, so it has to keep working.
      - name: Lint
        run: uv run ruff check src tests tools
      - name: Format check
        run: uv run ruff format --check src tests tools
      - name: Tests (no network, no creds)
        run: uv run pytest -q
