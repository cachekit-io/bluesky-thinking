# Builds the Skyline ingester container (LAB-2383). On pull requests the image
# is built but never pushed, so reviewers see the Dockerfile proven green
# before merge; on pushes to main it is published to GHCR as both `latest` and
# the commit SHA (the SHA tag is what deploy/k3s/ pins against for rollbacks).
name: ingester-image

on:
  pull_request:
    paths:
      - "ingester/**"
      - ".github/workflows/ingester-image.yml"
  push:
    branches: [main]
    paths:
      - "ingester/**"
      - ".github/workflows/ingester-image.yml"

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed only by the main-branch publish; harmless on the PR path
      # because push is gated off there (and fork PRs get a read-only token).
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and publish on main)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ingester
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/cachekit-io/skyline-ingester:latest
            ghcr.io/cachekit-io/skyline-ingester:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
