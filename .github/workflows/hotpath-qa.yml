name: hotpath-qa

on:
  pull_request:
    paths:
      - "hotpath/**"
      - ".github/workflows/hotpath-qa.yml"
  push:
    branches: [main]
    paths:
      - "hotpath/**"
      - ".github/workflows/hotpath-qa.yml"

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotpath
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: hotpath
      - name: Tests (no network, no creds)
        run: cargo test --locked
      - name: Clippy (native)
        run: cargo clippy --all-targets --locked -- -D warnings

  # wasm32 must BUILD, not just lint — LAB-1079 reached a deployed Worker
  # because clippy-only coverage compiles a runtime panic happily.
  wasm32:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotpath
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: hotpath
      - name: Clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings
      # Build-chain pins from docs/architecture.md §Build-chain pins:
      # worker-build@^0.1 with wasm-bindgen-cli 0.2.126 pre-installed on PATH —
      # worker-build 0.1.x auto-downloads CLI 0.2.105 and fails against the
      # crate graph's `wasm-bindgen = "=0.2.126"` pin.
      - name: Install wasm-bindgen-cli 0.2.126 (pinned, checksummed)
        run: |
          curl -sSfL -o /tmp/wb.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.126/wasm-bindgen-0.2.126-x86_64-unknown-linux-musl.tar.gz
          echo "064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d  /tmp/wb.tar.gz" | sha256sum -c -
          mkdir -p /tmp/wb126
          tar xzf /tmp/wb.tar.gz -C /tmp/wb126 --strip-components=1
          echo "/tmp/wb126" >> "$GITHUB_PATH"
      - name: Install worker-build 0.1.14 (pinned)
        run: cargo install worker-build --version 0.1.14 --locked
      - name: Worker build (wasm32, release)
        run: worker-build --release
