# Skyline hot-path Worker. The TS edge reaches it through a service binding.
name = "skyline-hotpath"
main = "build/worker/shim.mjs"
compatibility_date = "2026-07-01"

[build]
command = "worker-build --release"

# Set from your secret manager, never this file: see hotpath/README.md#secrets.
[secrets]
required = ["CACHEKIT_API_KEY", "CACHEKIT_API_URL"]
