[project]
name = "skyline-ingester"
version = "0.1.0"
description = "Skyline Stage-2 Python ingester: Bluesky Jetstream -> sliding windows -> CacheKit interop/v1 aggregates"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "cachekit==0.17.1",
    "websockets>=13",
    "pydantic-settings>=2.6",
]

[project.scripts]
skyline-ingester = "skyline_ingester.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyline_ingester"]

[tool.ruff]
line-length = 129
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
